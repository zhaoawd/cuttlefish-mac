name: Host unit tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
